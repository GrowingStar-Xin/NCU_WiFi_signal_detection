        html,

<body>
    <div id="map"></div>
    <!-- Map Controls (Glassmorphism) -->
    <div class="absolute top-1/2 -translate-y-1/2 right-6 flex flex-col gap-3 z-[900]">
        <button class="bg-black/80 text-white w-10 h-10 rounded-lg shadow-lg backdrop-blur-sm border border-gray-700 hover:bg-gray-700 transition-colors flex items-center justify-center" onclick="zoomIn()" title="放大">
            <i class="fas fa-plus"></i>
        </button>
        <button class="bg-black/80 text-white w-10 h-10 rounded-lg shadow-lg backdrop-blur-sm border border-gray-700 hover:bg-gray-700 transition-colors flex items-center justify-center" onclick="zoomOut()" title="缩小">
            <i class="fas fa-minus"></i>
        </button>
        <button class="bg-black/80 text-white px-3 h-10 rounded-lg shadow-lg backdrop-blur-sm border border-gray-700 hover:bg-gray-700 transition-colors text-sm font-bold flex items-center justify-center gap-2" onclick="toCenter()" title="地图复位">
            <i class="fas fa-compress"></i> 复位
        </button>
    </div>



    <script>
        window.addEventListener('load', () => {
            if (!window.creeper) {
                console.error('Creeper SDK 未加载，检查 /js/bundle.min.js 是否可访问。');
                alert('地图 SDK 加载失败，请查看控制台信息');
                return;
            }

            const mapElement = document.getElementById('map');
            if (!mapElement) {
                console.error('未找到地图容器元素 #map。');
                return;
            }

            const state = {
                map: null,
                mapCenter: null,
                zoom: null,
                marker: null
            };

            var map = null;
            let token = 'oreiorhzbxmbnqwhgeqkw';
            if (window.creeper && window.creeper.CreeperConfig) {
                window.creeper.CreeperConfig.token = token;
            }

            try {
                map = new creeper.VectorMap('map', 2, 'https://gis.ncu.edu.cn/cmgis-server/', token);
                state.map = map;
            } catch (err) {
                console.error('创建地图实例失败:', err);
                alert('地图初始化失败，请查看控制台。');
                return;
            }

            if (window.$ && window.$.ajaxSettings) {
                window.$.ajaxSettings.async = false;
            }
            
            state.map.on('load', () => {
                state.mapCenter = [state.map.getCenter().lng, state.map.getCenter().lat];
                state.zoom = state.map.getZoom();
                new creeper.Marker().setLngLat(state.mapCenter).addTo(state.map);

                try {
                    var echart = null;
                    var chart = null;
                    var geoCoordMap = {
                        '第三实验大楼': [115.7897277095,28.6506527094],
                        '第一/二食堂': [115.799148073692,28.6677586343377],
                        '游泳馆': [115.806199520133,28.6674809501594],
                        '第九/十食堂': [115.791309290579,28.6598841107059]
                    };
                    var migrate = [
                        [
                            { name: '第三实验大楼' },
                            { name: '第一/二食堂', value: 1 }
                        ],
                        [
                            { name: '游泳馆' },
                            { name: '第一/二食堂', value: 1 }
                        ],
                        [
                            { name: '游泳馆' },
                            { name: '二号教学楼', value: 1 }
                        ]
                    ];

                    var initOption = function (geoCoordMap, migrate) {
                        var convertLines = function (data) {
                            var res = [];
                            for (var i = 0; i < data.length; i++) {
                                var pair = data[i];
                                var from = pair[0].name;
                                var to = pair[1].name;
                                var fromCoord = geoCoordMap[from];
                                var toCoord = geoCoordMap[to];
                                if (fromCoord && toCoord) {
                                    res.push({ coords: [fromCoord, toCoord] });
                                }
                            }
                            return res;
                        };

                        var scatterData = [];
                        for (var key in geoCoordMap) {
                            if (Object.prototype.hasOwnProperty.call(geoCoordMap, key)) {
                                var coord = geoCoordMap[key];
                                scatterData.push({ name: key, value: [coord[0], coord[1], 1] });
                            }
                        }

                        return {
                            animation: true,
                            geo: {
                                map: '',
                                roam: true,
                                silent: true,
                                label: { show: false },
                                itemStyle: { areaColor: 'transparent', borderColor: 'transparent' }
                            },
                            series: [
                                {
                                    type: 'lines',
                                    coordinateSystem: 'geo',
                                    zlevel: 2,
                                    effect: { show: true, period: 6, trailLength: 0.1, symbol: 'arrow', symbolSize: 6 },
                                    lineStyle: { color: '#ff4757', width: 2, opacity: 0.6 },
                                    data: convertLines(migrate)
                                },
                                {
                                    type: 'effectScatter',
                                    coordinateSystem: 'geo',
                                    zlevel: 2,
                                    rippleEffect: { brushType: 'stroke' },
                                    symbolSize: 8,
                                    itemStyle: { color: '#409EFF' },
                                    data: scatterData
                                }
                            ]
                        };
                    };

                    if (window.EchartsLayer && window.echarts) {
                        echart = new window.EchartsLayer(state.map);
                        chart = echart.chart;
                        chart.setOption(initOption(geoCoordMap, migrate));
                    } else {
                        console.error('EchartsLayer 插件不可用，请按 ceshi.md 方式加载插件');
                    }
                } catch (e) {
                    console.warn('ECharts绘制失败');
                }
            });

            state.map.on('error', evt => {
                console.error('地图运行时错误:', evt);
            });

            state.map.on('click', evt => {
                if (state.marker) {
                    state.marker.remove();
                }
                state.marker = new creeper.Marker().setLngLat(evt.lngLat).addTo(state.map);
            });



            window.zoomOut = () => {
                state.map.zoomOut();
            };

            window.zoomIn = () => {
                state.map.zoomIn();
            };

            window.toCenter = () => {
                if (!state.mapCenter || state.zoom === null) {
                    console.warn('地图尚未完成加载，无法复位');
                    return;
                }
                state.map.flyTo({
                    center: state.mapCenter,
                    zoom: state.zoom,
                    speed: 0.8,
                    curve: 1
                });
            };
        });
    </script>

        <!-- Dashboard Toggle Button (Always Visible) -->
        <div class="absolute top-4 left-4 pointer-events-auto z-[1001] flex gap-2">
            <button id="toggle-dashboard" class="bg-white/90 text-slate-700 p-2 rounded-lg shadow-lg backdrop-blur-sm border border-gray-200 hover:bg-gray-50 transition-colors w-10 h-10 flex items-center justify-center" title="切换仪表盘显示">
                <i class="fas fa-eye"></i>
            </button>
            <a href="analytics.html" class="bg-white/90 text-slate-700 p-2 rounded-lg shadow-lg backdrop-blur-sm border border-gray-200 hover:bg-gray-50 transition-colors w-10 h-10 flex items-center justify-center" title="打开数据分析大屏">
                <i class="fas fa-chart-pie"></i>
            </a>
        </div>

        <!-- Top Bar (Stats) -->
        <div id="dashboard-top" class="flex justify-start items-start pointer-events-auto mt-12 transition-all duration-300 origin-top-left">
            <!-- Stats Panel -->
            <div id="panel-stats" class="bg-white/90 text-slate-800 p-4 rounded-lg shadow-lg backdrop-blur-sm w-64 border border-gray-200">
                <div class="flex justify-between items-center mb-3 border-b border-gray-200 pb-2">
                    <h3 class="text-lg font-bold"><i class="fas fa-chart-line mr-2 text-blue-500"></i>WiFi 监控概览</h3>
                    <button class="text-gray-400 hover:text-slate-600 text-xs" onclick="toggleWidget('panel-stats')">
                        <i class="fas fa-chevron-down"></i>
                    </button>
                </div>
                <div id="stats-content" class="panel-body space-y-3 transition-all duration-300">
                    <div class="flex justify-between items-center">
                        <span class="text-slate-500 text-sm">总日志数</span>
                        <span class="text-xl font-mono text-blue-600" id="stat-total">Loading...</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-500 text-sm">平均信号</span>
                        <span class="text-xl font-mono text-green-600" id="stat-signal">-</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-500 text-sm">漫游次数</span>
                        <span class="text-xl font-mono text-yellow-600" id="stat-roam">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Left (Logs) -->
        <div id="dashboard-bottom" class="flex justify-start items-end pointer-events-none h-auto gap-4 transition-all duration-300 origin-bottom-left max-w-[40%]">
            <!-- Logs Panel -->
            <div id="panel-logs" class="pointer-events-auto bg-white/90 text-slate-800 p-4 rounded-lg shadow-lg backdrop-blur-sm flex-1 h-[33vh] border border-gray-200 flex flex-col relative group">
                <h3 class="text-sm font-bold mb-2 text-slate-700 flex justify-between items-center">
                    <span><i class="fas fa-list-alt mr-2 text-purple-500"></i>实时日志流 <span class="text-xs font-normal text-slate-400 ml-2">最近 50 条</span></span>
                    <button class="text-gray-400 hover:text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity" onclick="toggleWidget('panel-logs')">
                        <i class="fas fa-minus"></i>
                    </button>
                </h3>
                <div class="panel-body overflow-y-auto flex-1 text-xs font-mono space-y-1 pr-2 custom-scrollbar transition-all duration-300" id="log-container">
                    <!-- Logs will be injected here -->
                    <div class="text-slate-400 text-center mt-4">正在加载数据...</div>
                </div>
            </div>
        </div>
        
        <!-- Bottom Right (Charts) -->
        <div id="dashboard-right-bottom" class="absolute bottom-6 right-6 pointer-events-auto transition-all duration-300 origin-bottom-right">
             <!-- Chart Panel -->
             <div id="panel-chart" class="bg-white/90 text-slate-800 p-4 rounded-lg shadow-lg backdrop-blur-sm w-64 h-64 border border-gray-200 flex flex-col relative group">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-sm font-bold text-slate-700"><i class="fas fa-wifi mr-2 text-orange-500"></i>频段分布</h3>
                    <button class="text-gray-400 hover:text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity" onclick="toggleWidget('panel-chart')">
                        <i class="fas fa-minus"></i>
                    </button>
                </div>
                <div id="bandChart" class="panel-body flex-1 w-full transition-all duration-300"></div>
            </div>
        </div>
    </div>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 2px; }
        
        /* Transitions for toggle */
        .panel-hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }
        
        /* New Minimized State */
        .panel-minimized {
            height: auto !important;
            width: auto !important;
            min-height: 0 !important;
            flex: 0 0 auto !important;
        }
        .panel-minimized .panel-body {
            display: none !important;
        }
    </style>

    <script>
        // UI Toggle Logic
        document.getElementById('toggle-dashboard').addEventListener('click', function() {
            const topPanel = document.getElementById('dashboard-top');
            const bottomPanel = document.getElementById('dashboard-bottom');
            const rightBottomPanel = document.getElementById('dashboard-right-bottom');
            const icon = this.querySelector('i');
            
            const isHidden = topPanel.classList.contains('panel-hidden');
            
            if (isHidden) {
                topPanel.classList.remove('panel-hidden');
                bottomPanel.classList.remove('panel-hidden');
                rightBottomPanel.classList.remove('panel-hidden');
                icon.className = 'fas fa-eye';
                this.classList.replace('bg-red-500', 'bg-white/90'); // Restore color
            } else {
                topPanel.classList.add('panel-hidden');
                bottomPanel.classList.add('panel-hidden');
                rightBottomPanel.classList.add('panel-hidden');
                icon.className = 'fas fa-eye-slash';
                // Optional: highlight button when hidden to remind user
            }
        });

        window.toggleWidget = function(panelId) {
            const panel = document.getElementById(panelId);
            const icon = panel.querySelector('.fa-minus') || panel.querySelector('.fa-plus') || 
                         panel.querySelector('.fa-chevron-down') || panel.querySelector('.fa-chevron-up');
            
            panel.classList.toggle('panel-minimized');
            
            const isMinimized = panel.classList.contains('panel-minimized');
            
            if (icon) {
                if (icon.classList.contains('fa-chevron-down')) {
                    icon.className = isMinimized ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
                } else if (icon.classList.contains('fa-chevron-up')) {
                    icon.className = isMinimized ? 'fas fa-chevron-down' : 'fas fa-chevron-up';
                } else if (icon.classList.contains('fa-minus')) {
                    icon.className = isMinimized ? 'fas fa-plus' : 'fas fa-minus';
                } else if (icon.classList.contains('fa-plus')) {
                    icon.className = isMinimized ? 'fas fa-minus' : 'fas fa-plus';
                }
            }
        };

        (function() {
            const csvUrl = '/data/track_files/track_1762512900_1_dec.csv';
            
            async function loadData() {
                try {
                    const response = await fetch(csvUrl);
                    if (!response.ok) throw new Error('Network response was not ok');
                    const text = await response.text();
                    const rows = parseCSV(text);
                    processAndRender(rows);
                } catch (e) {
                    console.error('Failed to load CSV', e);
                    document.getElementById('log-container').innerHTML = '<div class="text-red-500 p-2">加载数据失败: ' + e.message + '<br>请确保已运行: <code>npm run dev</code></div>';
                }
            }

            function parseCSV(text) {
                const lines = text.split('\n').filter(l => l.trim());
                return lines.slice(1).map(line => {
                    // Handle simple CSV splitting
                    return line.split(',');
                });
            }

            function processAndRender(rows) {
                const total = rows.length;
                let signalSum = 0;
                let signalCount = 0;
                let roamCount = 0;
                let band24 = 0;
                let band5 = 0;
                
                const logs = [];

                rows.forEach(row => {
                    // 0: MAC, 1: Type, 2: Time, 3: Behavior, 4: Detail, 5: IP, 6: SSID, 7: Band, 8: Channel, 9: Signal
                    const signalStr = row[9] || "";
                    if(signalStr.includes('dBm')) {
                        const sig = parseInt(signalStr);
                        if(!isNaN(sig)) {
                            signalSum += sig;
                            signalCount++;
                        }
                    }
                    
                    const behavior = row[3] || "";
                    if(behavior.includes('漫游')) roamCount++;
                    
                    const band = row[7] || "";
                    if(band.includes('2.4G')) band24++;
                    else if(band.includes('5G')) band5++;

                    logs.push({
                        time: row[2],
                        mac: row[0],
                        behavior: row[3],
                        detail: row[4],
                        signal: row[9]
                    });
                });

                document.getElementById('stat-total').textContent = total;
                document.getElementById('stat-signal').textContent = signalCount ? Math.round(signalSum / signalCount) + ' dBm' : '-';
                document.getElementById('stat-roam').textContent = roamCount;

                if(window.echarts) {
                    const chartDom = document.getElementById('bandChart');
                    const myChart = echarts.init(chartDom);
                    const option = {
                        tooltip: { trigger: 'item' },
                        legend: { bottom: '0%', textStyle: { color: '#ccc', fontSize: 10 }, itemWidth: 10, itemHeight: 10 },
                        series: [
                            {
                                name: '频段',
                                type: 'pie',
                                radius: ['40%', '70%'],
                                avoidLabelOverlap: false,
                                label: { show: false },
                                data: [
                                    { value: band24, name: '2.4G', itemStyle: { color: '#3b82f6' } },
                                    { value: band5, name: '5G', itemStyle: { color: '#8b5cf6' } }
                                ]
                            }
                        ]
                    };
                    myChart.setOption(option);
                    window.addEventListener('resize', () => myChart.resize());
                }

                const logContainer = document.getElementById('log-container');
                logContainer.innerHTML = logs.slice(0, 50).map(log => {
                    let colorClass = 'text-blue-400';
                    if(log.behavior?.includes('上线')) colorClass = 'text-green-400';
                    else if(log.behavior?.includes('下线')) colorClass = 'text-gray-400';
                    else if(log.behavior?.includes('漫游')) colorClass = 'text-yellow-400';
                    else if(log.behavior?.includes('异常')) colorClass = 'text-red-400';

                    return `
                    <div class="border-b border-gray-800 pb-1 mb-1 hover:bg-white/5 transition-colors p-1 rounded">
                        <div class="flex justify-between text-gray-400">
                            <span>${log.time?.split(' ')[3] || log.time}</span>
                            <span class="${colorClass}">${log.behavior}</span>
                        </div>
                        <div class="truncate text-gray-500" title="${log.detail}">${log.detail}</div>
                        <div class="flex justify-between mt-1">
                            <span class="text-gray-600">${log.mac}</span>
                            <span class="text-gray-600">${log.signal || '-'}</span>
                        </div>
                    </div>`;
                }).join('');
            }

            loadData();
        })();
    </script>
</body></html>
